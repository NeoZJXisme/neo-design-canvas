name: Neo Canvas Desktop v0.1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-canvas-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            canvas-agent/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install matching Windows native packages
        working-directory: web
        shell: pwsh
        run: |
          $rollupVersion = node -p "require('./node_modules/rollup/package.json').version"
          npm install --no-save --package-lock=false --legacy-peer-deps "@rollup/rollup-win32-x64-msvc@$rollupVersion" "@ant-design/icons@6.1.1" "@ant-design/icons-svg@4.4.2"

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Install Canvas Agent dependencies
        working-directory: canvas-agent
        run: npm ci

      - name: Build Canvas Agent
        working-directory: canvas-agent
        run: npm run build

      - name: Prune Canvas Agent development dependencies
        working-directory: canvas-agent
        run: npm prune --omit=dev

      - name: Verify Canvas Agent runtime dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path "canvas-agent/node_modules/express/package.json")) { throw "express is missing before desktop packaging." }
          if (-not (Test-Path "canvas-agent/node_modules/@openai/codex/package.json")) { throw "@openai/codex is missing before desktop packaging." }
          if (-not (Test-Path "desktop/preload.cjs")) { throw "NZX desktop preload bridge is missing." }

      - name: Install desktop packager
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run dist:win

      - name: Verify packaged Canvas Agent dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/dist/win-unpacked/resources/canvas-agent/node_modules/express/package.json")) { throw "express was not copied into the packaged Canvas Agent." }
          if (-not (Test-Path "desktop/dist/win-unpacked/resources/canvas-agent/node_modules/@openai/codex/package.json")) { throw "@openai/codex was not copied into the packaged Canvas Agent." }

      - name: Smoke launch packaged desktop
        shell: pwsh
        run: |
          $appPath = Resolve-Path "desktop/dist/win-unpacked/Neo Canvas.exe"
          $smokeLog = Join-Path $env:RUNNER_TEMP "neo-canvas-desktop-smoke.log"
          Remove-Item $smokeLog -ErrorAction SilentlyContinue
          $env:NEO_CANVAS_SMOKE_TEST = "1"
          $env:NEO_CANVAS_LOG_FILE = $smokeLog
          $process = Start-Process -FilePath $appPath -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $smokeLog) {
              $content = Get-Content $smokeLog -Raw
              if ($content -match "Desktop smoke test passed|Fatal startup error|Canvas Agent startup failed") { break }
            }
            if ($process.HasExited) { break }
            Start-Sleep -Milliseconds 500
            $process.Refresh()
          }
          $content = if (Test-Path $smokeLog) { Get-Content $smokeLog -Raw } else { "<smoke log not created>" }
          Write-Host "----- Neo Canvas desktop smoke log -----"
          Write-Host $content
          Write-Host "----- end smoke log -----"
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          if ($content -match "Fatal startup error|Canvas Agent startup failed") { throw "Neo Canvas reported a fatal desktop startup error." }
          if ($content -notmatch "Canvas Agent ready:|Using existing Canvas Agent:") { throw "Creative Director Agent did not become ready." }
          if ($content -notmatch "Main window loaded") { throw "Neo Canvas main window did not load." }
          if ($content -notmatch "Desktop smoke test passed") { throw "Neo Canvas desktop smoke hook did not complete within 30 seconds." }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/dist/Neo-Canvas-Setup-0.1.4.exe" | Select-Object -First 1
          if (-not $installer) { throw "Neo Canvas installer was not generated." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "SHA-256: $hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: neo-canvas-windows-v0.1.4-nzx-projects
          path: |
            desktop/dist/Neo-Canvas-Setup-0.1.4.exe
            desktop/dist/Neo-Canvas-Setup-0.1.4.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
